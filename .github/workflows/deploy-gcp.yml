name: Deploy to Google Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Container to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        continue-on-error: true

      - name: 🛠️ Set up Google Cloud SDK
        if: steps.gcp-auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: voxpulse-ai-enterprise

      - name: 🚀 Deploy to Google Cloud Run
        if: steps.gcp-auth.outcome == 'success'
        run: |
          gcloud run deploy voxpulse-ai \
            --source . \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars NODE_ENV=production,GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},TELNYX_API_KEY=${{ secrets.TELNYX_API_KEY }}

      - name: ℹ️ Deployment Status Notice
        if: steps.gcp-auth.outcome != 'success'
        run: |
          echo "::notice ::Automated GitHub Actions GCP Deploy skipped: Configure GCP_SA_KEY secret in GitHub repository settings to enable automated push-to-deploy."
